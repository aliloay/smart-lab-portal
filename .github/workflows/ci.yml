name: CI

on:
  push:
    branches: [main, 'ui/**']
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      # The tests run against real PostgreSQL, not SQLite (see tests/conftest.py).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/smartlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # The migrations must build the same schema the models describe.
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Navigation (real browser)
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/smartlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python seed.py
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
      - name: Web
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Wait for both
        run: |
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/health && curl -fs http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 2
          done
          cat api.log web.log; exit 1
      # playwright-core drives the Google Chrome preinstalled on the runner.
      - name: No blank pages, no refresh needed
        working-directory: frontend
        run: npm run test:e2e
      # Writes to the throwaway CI database: booking, staff booking, issue + photo.
      - name: Workflows (booking to QR, issue with photo, phone width)
        working-directory: frontend
        run: npm run test:e2e:workflows
      - if: failure()
        run: cat api.log web.log

  compose:
    # The documented launch path (docker compose up / launch.bat), started
    # exactly as a user would and checked from outside: the portal on :80 as
    # a phone uses it, the API on :8000 as the ESP32 master calls it.
    name: Docker Compose (full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Phone and ESP32 paths
        run: python3 scripts/compose_smoke.py
      - name: Restart the API - migrating and seeding again must be harmless
        run: |
          docker compose restart backend
          python3 scripts/compose_smoke.py
      - name: Database is published to this machine only
        run: test "$(docker compose port db 5432)" = "127.0.0.1:5433"
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v
