; PlatformIO build of the SAME sources as the Arduino IDE sketch
; (SmartLab_Reusable_Bin_Modular.ino + src/). Not built on this laptop
; (PlatformIO is not installed here) - the Arduino build is the verified one.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino> +<src/*.cpp>
lib_deps =
  robtillaart/HX711 @ 0.6.5
  marcoschwartz/LiquidCrystal_I2C   ; Arduino build used 1.1.2 (Frank de Brabander) - registry version not checked
  adafruit/Adafruit PN532 @ 1.3.4
  madhephaestus/ESP32Servo @ 3.2.1
  bblanchon/ArduinoJson @ 7.4.3
; FULL_SYSTEM_MODE without editing config.h:
;   build_flags = -DBIN_MODE=2
