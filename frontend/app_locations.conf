# The portal's locations, shared by every server block (80, 8080, 443, 8443).
root /usr/share/nginx/html;
index index.html;

# Never serve hidden files (.env, .git, ...) - there are none in the image,
# but a mistake must not expose them. Directory listing is off (nginx default).
location ~ /\. {
    deny all;
    return 404;
}

# Built assets have content hashes in their names: cache them for a year.
location /assets/ {
    include /etc/nginx/security_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Single-page app: unknown paths are routes, not missing files. index.html
# itself is never cached, so a new build is picked up at once.
location / {
    include /etc/nginx/security_headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}

location /api/ {
    include /etc/nginx/security_headers.conf;
    # Issue photos: up to 6 files per request, 12 MB each. nginx's default
    # of 1 MB would reject almost every phone photo with a 413.
    client_max_body_size 80m;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# AI questions can take minutes when the free local model runs on the
# processor; the default 60 s gave "Gateway timeout".
location /api/ai/ {
    include /etc/nginx/security_headers.conf;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# The live activity stream needs an upgrade handshake.
location /ws/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}
