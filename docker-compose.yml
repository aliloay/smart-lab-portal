# A fixed project name keeps ONE database no matter which folder or clone
# this is started from: the volumes are always smart-lab-portal_pgdata and
# smart-lab-portal_uploads, reused by every start and every rebuild.
name: smart-lab-portal

services:
  db:
    # Back by itself after Docker Desktop restarts (update, laptop reboot); stop_all.bat uses
    # `docker compose stop`, which this policy respects - a deliberate stop stays stopped.
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartlab}
      POSTGRES_DB: smartlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlab"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Reachable from this laptop only (pgAdmin, psql, pg_dump) on port 5433:
    # 5432 is usually taken by a locally installed PostgreSQL, and the
    # database has no business being open to the Wi-Fi. The backend reaches
    # it inside the compose network as db:5432.
    ports: ["127.0.0.1:${SMARTLAB_DB_PORT:-5433}:5432"]

  # Automatic backups: a full dump at start and every BACKUP_EVERY_HOURS, into
  # ./backups (gitignored; inside OneDrive, so also copied off the laptop), each
  # dump checked readable before it is kept; uploads (photos, snapshots) once a
  # day. Old backups are never deleted - a dump is ~200 KB. backup_status.json
  # tells the portal how the last run went (app.services.backups alerts on a
  # failure). Restore: docs/DATABASE.md.
  backup:
    # postgres:16-alpine + openssl (backup/Dockerfile) for the optional encryption below
    build: ./backup
    image: smart-lab-portal-backup:latest
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: smartlab
      PGPASSWORD: ${POSTGRES_PASSWORD:-smartlab}
      PGDATABASE: smartlab
      TZ: Africa/Cairo
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-6}
      # 2026-11-12: optional. Set in .env to keep only AES-256 encrypted dumps (*.dump.enc). Empty = unchanged.
      # Restore: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in X.dump.enc -out X.dump
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # 2026-11-21 (audit F-09): retention without deleting anything (owner rule: never delete data). Older files are
      # MOVED from ./backups (C:) to the archive folder (BACKUP_ARCHIVE_DIR, e.g. D:/SmartLabData/backup_archive).
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      UPLOADS_KEEP_DAYS: ${UPLOADS_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ${BACKUP_ARCHIVE_DIR:-./backups_archive}:/archive
      - uploads:/uploads:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        status() {
          echo "{\"ok\": $$1, \"last_attempt\": \"$$2\", \"last_success\": $$3, \"file\": $$4, \"size_kb\": $$5, \"every_hours\": $$BACKUP_EVERY_HOURS}" > /backups/backup_status.json
        }
        last_ok=null
        while true; do
          f=/backups/auto_smartlab_$$(date +%Y%m%d_%H%M).dump
          now=$$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          if pg_dump -Fc -f "$$f.part" && pg_restore --list "$$f.part" >/dev/null; then
            mv "$$f.part" "$$f"
            # Optional encryption: the passphrase stays in the environment (never on a command line or in a log).
            # The plain dump is removed only after the encrypted copy decrypts back to a valid dump.
            if [ -n "$$BACKUP_PASSPHRASE" ]; then
              if openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in "$$f" -out "$$f.enc" &&
                 openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in "$$f.enc" | pg_restore --list >/dev/null; then
                rm -f "$$f"; f="$$f.enc"; echo "backup encrypted (AES-256)"
              else
                rm -f "$$f.enc"; echo "ENCRYPTION FAILED - the plain dump is kept"
              fi
            fi
            kb=$$(du -k "$$f" | cut -f1)
            last_ok="\"$$now\""
            echo "backup saved: $$f ($$kb KB)"
            u=/backups/auto_uploads_$$(date +%Y%m%d).tar.gz
            # The uploads hold camera snapshots of people (audit F-09): with a passphrase they are encrypted straight
            # from the stream (no plain copy is written) and checked by listing the archive back; otherwise as before.
            if [ ! -f "$$u" ] && [ ! -f "$$u.enc" ]; then
              if [ -n "$$BACKUP_PASSPHRASE" ]; then
                tar czf - -C /uploads . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$$u.enc.part" &&
                  openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in "$$u.enc.part" | tar tzf - >/dev/null &&
                  mv "$$u.enc.part" "$$u.enc" && echo "uploads backup encrypted (AES-256)" ||
                  { mv "$$u.enc.part" "$$u.enc.failed" 2>/dev/null; echo "UPLOADS ENCRYPTION FAILED - kept as .failed"; }
              else
                tar czf "$$u" -C /uploads . || echo "uploads backup failed"
              fi
            fi
            # Retention: MOVE (never delete) older automatic backups to the archive folder on D:.
            if [ -d /archive ] && [ -w /archive ]; then
              moved=0
              for old in $$(find /backups -maxdepth 1 -type f \( -name 'auto_smartlab_*.dump' -o -name 'auto_smartlab_*.dump.enc' \) -mtime +$$BACKUP_KEEP_DAYS) \
                         $$(find /backups -maxdepth 1 -type f \( -name 'auto_uploads_*.tar.gz' -o -name 'auto_uploads_*.tar.gz.enc' \) -mtime +$$UPLOADS_KEEP_DAYS); do
                mv -n "$$old" /archive/ && moved=$$((moved + 1))
              done
              [ "$$moved" -gt 0 ] && echo "retention: moved $$moved old backup(s) to /archive"
            fi
            status true "$$now" "$$last_ok" "\"$$(basename $$f)\"" "$$kb"
          else
            echo "BACKUP FAILED at $$now"
            rm -f "$$f.part"
            status false "$$now" "$$last_ok" null null
            # A failure (e.g. a moment without DNS) is retried in 5 min, not
            # after a whole interval - one glitch once left 26 h without a backup.
            sleep 300
            continue
          fi
          # 2026-11-19: wait by the wall clock in 1-minute steps. One long `sleep` does not count the time the
          # laptop is suspended (the Docker VM's clock stops), so a night asleep left 14 h without a backup.
          next=$$(( $$(date +%s) + BACKUP_EVERY_HOURS * 3600 ))
          while [ "$$(date +%s)" -lt "$$next" ]; do sleep 60; done
        done
    restart: unless-stopped
    healthcheck:
      # Healthy = the last backup attempt is not older than the interval plus an hour.
      test: ["CMD-SHELL", "test -n \"$$(find /backups/backup_status.json -mmin -$$((BACKUP_EVERY_HOURS * 60 + 60)) 2>/dev/null)\""]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 15m

  backend:
    # Back by itself after Docker Desktop restarts (update, laptop reboot); stop_all.bat uses
    # `docker compose stop`, which this policy respects - a deliberate stop stays stopped.
    restart: unless-stopped
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    # Ready = /api/health answers AND says the database works (2026-11-16): the endpoint returns HTTP 200 with
    # "status":"degraded" when the database is down, so a status-code-only check (the image's own curl HEALTHCHECK)
    # would call that healthy. Python is always in the image; no shell, no environment values involved.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)); sys.exit(0 if r.get('status')=='ok' and r.get('database') is True else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://smartlab:${POSTGRES_PASSWORD:-smartlab}@db:5432/smartlab
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-dev-device-key-change-me}
      BACKUP_STATUS_PATH: /backups/backup_status.json
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      # Automation (n8n) - all optional. Unset = the portal runs exactly as
      # before and /api/automation answers 503. See docs/AUTOMATION.md.
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:-}
      AUTOMATION_WEBHOOK_BASE: ${AUTOMATION_WEBHOOK_BASE:-}
      AUTOMATION_WEBHOOK_TOKEN: ${AUTOMATION_WEBHOOK_TOKEN:-}
      # AI assistant - optional. See docs/AI_ASSISTANT.md.
      # Free: Ollama installed on this computer, reached from the container
      # via host.docker.internal. If Ollama is not installed the assistant
      # just says so; nothing else is affected.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      # First-run passwords for the seeded accounts (seed.py). Empty = a random password nobody knows;
      # set one later with: docker compose exec backend python set_password.py <email>
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Face enrollment from the portal: the door camera on the lab Wi-Fi and
      # the face server running on this laptop (outside Docker).
      CAMERA_URL: ${CAMERA_URL:-http://192.168.1.150}
      FACE_SERVER_URL: ${FACE_SERVER_URL:-http://host.docker.internal:5000}
      SECURITY_VISION_HOST: ${SECURITY_VISION_HOST:-host.docker.internal}
      # Project knowledge (staff/admin): tools/knowledge/serve.py on this laptop, 127.0.0.1 only.
      KB_SERVICE_URL: ${KB_SERVICE_URL:-http://host.docker.internal:5199}
      KB_SERVICE_KEY: ${KB_SERVICE_KEY:-}
      # Voice for the assistant (2026-10-26): tools/voice/voice_service.py on this laptop, 127.0.0.1:5320.
      VOICE_URL: ${VOICE_URL:-http://host.docker.internal:5320}
      VOICE_KEY: ${VOICE_KEY:-}
      # OPC UA feed (tools/opcua/opcua_server.py): read-only; empty = off.
      OPCUA_KEY: ${OPCUA_KEY:-}
      # Robot control (docs/ROBOT_CONTROL.md): dry_run until the owner signs off a commissioning step.
      ROBOT_CONTROL: ${ROBOT_CONTROL:-off}     # 2026-10-29 owner: monitoring only
      UR5E_CONTROL_PATH: ${UR5E_CONTROL_PATH:-local_agent}
      UR_AGENT_URL: ${UR_AGENT_URL:-http://host.docker.internal:5310}
      UR_AGENT_KEY: ${UR_AGENT_KEY:-}
      # Hardware stop relay (firmware/SmartLab_Robot_Stop): empty = not used.
      ROBOT_STOP_RELAY_UID: ${ROBOT_STOP_RELAY_UID:-}
      ROBOT_STOP_RELAY_ROBOT: ${ROBOT_STOP_RELAY_ROBOT:-UR5E_01}
      EMERGENCY_PASSWORD: ${EMERGENCY_PASSWORD:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      # Smaller student model, loaded next to the staff one (empty = share it).
      OLLAMA_STUDENT_MODEL: ${OLLAMA_STUDENT_MODEL:-qwen2.5:1.5b}
      OLLAMA_CPU_ONLY: ${OLLAMA_CPU_ONLY:-false}
      OLLAMA_GPU_POLICY: ${OLLAMA_GPU_POLICY:-gpu}
      # CPU threads one AI answer may use (2026-10-18): Ollama runs above normal priority with every
      # core by default - one answer took camera 2 from 7 to 1.7 analyses/s. 0 = Ollama's default.
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
      # How long the model stays loaded after the last question (30m = no 30-60 s reload; 10m frees ~0.6 GB sooner).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      AI_STUDENT_ENABLED: ${AI_STUDENT_ENABLED:-true}
      # Paid alternative (Claude). Set AI_PROVIDER=ollama to keep using the
      # free model even when this key is present.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      SIGNUP_EMAIL_DOMAINS: ${SIGNUP_EMAIL_DOMAINS:-}
      SIGNUP_REQUIRES_APPROVAL: ${SIGNUP_REQUIRES_APPROVAL:-true}
      # Lab PC kit enrollment: true only while installing lab PCs (2026-11-11: it was not passed through at all,
      # so it could never be closed from .env).
      PC_ENROLL_OPEN: ${PC_ENROLL_OPEN:-false}
      # Temporary compatibility mode (checked 2026-11-16): the Master and the environment node already have their own
      # keys, but the consumable bin and the Modular reusable bin still send this shared key, so false would lock them
      # out. One shared key = a larger blast radius if one device is compromised. After the lab: issue own keys on
      # Devices, flash one node at a time, then set false (docs/hardware/DEVICE_KEY_MIGRATION.md).
      DEVICE_SHARED_KEY: ${DEVICE_SHARED_KEY:-true}
    # Migrations run before the API accepts traffic, so a fresh volume comes
    # up with the right schema without a manual step. seed.py only creates
    # what is missing (accounts, laboratories, devices, equipment) and never
    # overwrites or invents activity, so it is safe on every start; set
    # SEED_DEMO_DATA=false to skip it.
    command: >
      sh -c "alembic upgrade head &&
             if [ ${SEED_DEMO_DATA:-true} = true ]; then python seed.py; fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Issue photos. A named volume so they survive rebuilding the container.
    volumes:
      - uploads:/app/uploads
      - ./backups:/backups:ro    # read backup_status.json (backup monitor)
    # Published on every interface: the ESP32 master calls
    # http://<laptop LAN IP>:8000/api directly.
    ports: ["${SMARTLAB_API_PORT:-8000}:8000"]

  frontend:
    # Back by itself after Docker Desktop restarts (update, laptop reboot); stop_all.bat uses
    # `docker compose stop`, which this policy respects - a deliberate stop stays stopped.
    restart: unless-stopped
    build: ./frontend
    # Starts once the backend is READY, not merely started: without this the first page loads after a cold
    # `docker compose up` could get 502 while the API runs its migrations (2026-11-16).
    depends_on:
      backend: { condition: service_healthy }
    # The portal for browsers and phones: http://<laptop LAN IP>/
    # nginx serves the app and forwards /api and /ws to the backend, so the
    # browser only ever talks to this one address (no CORS, no API URL).
    #   80    the portal                       8080  the IoT Command Center (opens on /command)
    #   443 / 8443  the same over HTTPS, only once deploy/tls has a certificate
    #               from tools/tls/make_local_ca.py (docs/SECURITY.md)
    ports: ["${SMARTLAB_HTTP_PORT:-80}:80", "${SMARTLAB_HTTP_ALT_PORT:-8080}:8080", "${SMARTLAB_HTTPS_PORT:-443}:443", "${SMARTLAB_HTTPS_ALT_PORT:-8443}:8443"]
    volumes:
      - ./deploy/tls:/etc/nginx/tls:ro
    healthcheck:
      # nginx answers (with a certificate, port 8080 redirects to HTTPS: any HTTP answer counts).
      test: ["CMD-SHELL", "wget -q -S --spider http://127.0.0.1:8080/ 2>&1 | grep -q HTTP/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional self-hosted n8n: `docker compose --profile automation up -d`.
  # It reaches the API as http://backend:8000 inside this network, so no
  # tunnel is needed. It is never on the door path: the ESP32 talks to the
  # backend only, and nothing in n8n can open or lock a door.
  n8n:
    # Back by itself after Docker Desktop restarts (update, laptop reboot); stop_all.bat uses
    # `docker compose stop`, which this policy respects - a deliberate stop stays stopped.
    restart: unless-stopped
    image: n8nio/n8n:2.40.7   # the tested version (2026-11-04): "latest" could change under the 20+ workflows at any pull
    profiles: ["automation"]
    # Started, not "ready": n8n runs by itself and only calls the API when a workflow fires.
    depends_on: [backend]
    environment:
      GENERIC_TIMEZONE: ${TZ_NAME:-Africa/Cairo}
      TZ: ${TZ_NAME:-Africa/Cairo}
      # false on purpose: the editor is published on 127.0.0.1 only, over plain HTTP, and a Secure cookie needs HTTPS.
      # Not suitable for an exposed deployment: put TLS in front first, then set true (checked 2026-11-16).
      N8N_SECURE_COOKIE: "false"
      # IPv4: n8n binds "::" by default and exits on hosts with IPv6 disabled.
      N8N_LISTEN_ADDRESS: 0.0.0.0
      # Keep the SAME key that is already stored in the n8ndata volume's config file (a different one makes saved
      # credentials unreadable). Never commit it; empty = n8n generates one and keeps it only in that volume.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      # The lab runs on a router with no internet: no telemetry or update
      # checks, which otherwise fill the log with ENOTFOUND errors.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - n8ndata:/home/node/.n8n
      - ./automation/n8n/json:/workflows:ro
    # Editor on this laptop only.
    ports: ["127.0.0.1:${SMARTLAB_N8N_PORT:-5678}:5678"]

# The data. `docker compose up`, `down`, restarts and rebuilds all keep it;
# only `docker compose down -v` (or deleting the volume) erases it.
volumes:
  pgdata:
  uploads:
  n8ndata:
