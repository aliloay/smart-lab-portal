# HSTS header value: only sent over HTTPS.
map $scheme $hsts {
    https   "max-age=31536000";
    default "";
}

# Compress text (JS, CSS, JSON, SVG): the chart and 3D bundles shrink ~3-4x.
# Images and camera frames are already compressed and are left alone.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain model/gltf+json;

server_tokens off;                  # no nginx version in headers / error pages
# Docker's DNS, looked up again every 10 s: with a fixed name nginx kept the
# address it found at start, and every backend restart gave 502 Bad Gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

# The portal (HTTP). The door tablet and the ESP32 nodes do not use this
# port - they talk to the backend on :8000 directly - so nothing physical
# depends on what happens here.
server {
    listen 80;
    server_name _;
    set $backend http://backend:8000;
    # 2026-10-19 (owner): browsers go to HTTPS - HTTP/2 there lets a page's ~18 API calls share one
    # connection instead of queueing for http's 6. /api and /ws stay reachable here so nothing that still
    # uses http (scripts, an agent) breaks; the ESP32 nodes use :8000 directly anyway.
    if ($uri !~ ^/(api|ws)/) {
        return 301 https://$host$request_uri;
    }
    include /etc/nginx/app_locations.conf;
}

# The IoT Command Center: the same app and backend on its own port, opening
# straight on /command (wall screens, the engineer's monitor).
server {
    listen 8080;
    server_name _;
    set $backend http://backend:8000;
    if ($uri !~ ^/(api|ws)/) {
        return 301 https://$host:8443$request_uri;     # the Command Center over HTTPS (see :80)
    }
    location = / {
        include /etc/nginx/security_headers.conf;
        return 302 /command;
    }
    include /etc/nginx/app_locations.conf;
}
