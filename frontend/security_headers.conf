# Security headers for every response (included in each location: nginx drops
# inherited add_header lines in a block that sets its own).
#
# CSP: everything from this server only. Exceptions, with the reason:
#   img-src/media-src blob: data:  camera frames + recordings are shown as blob URLs; small inline SVG icons
#   connect-src ws: wss:           the live activity WebSocket on this same host
#   connect-src 127.0.0.1:47123    the PC agent on THIS PC only: which lab PC an admin signs in on (master PC)
#   style-src 'unsafe-inline'      React/recharts/framer-motion set style attributes; scripts stay strict
# No 'unsafe-eval', no external origins (the lab network has no internet).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss: http://127.0.0.1:47123; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS only over HTTPS ($hsts is empty on plain HTTP - see the map in nginx.conf).
add_header Strict-Transport-Security $hsts always;
